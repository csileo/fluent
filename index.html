<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Fluent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one-screen app — header, scrolling transcript, fixed talk bar; notebook and settings slide in as sheets. */
:root {
  --paper: #f1f5f4; --surface: #ffffff; --ink: #0e2a2f; --muted: #587074; --line: #d3dfdd;
  --accent: #0f6e6a; --accent-ink: #f2fbfa; --mark: #ffe45c; --mark-ink: #2f2700;
  --me: #0f6e6a; --me-ink: #f2fbfa; --danger: #b3261e; --listen: #c2410c;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0a181b; --surface: #112529; --ink: #e2eeed; --muted: #8ea5a7; --line: #1f3a3e;
  --accent: #4fc3b8; --accent-ink: #062321; --mark: #e6cc38; --mark-ink: #221c00;
  --me: #1b4e4a; --me-ink: #e8f7f5; --danger: #f2877f; --listen: #fb923c; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0a181b; --surface: #112529; --ink: #e2eeed; --muted: #8ea5a7; --line: #1f3a3e;
  --accent: #4fc3b8; --accent-ink: #062321; --mark: #e6cc38; --mark-ink: #221c00;
  --me: #1b4e4a; --me-ink: #e8f7f5; --danger: #f2877f; --listen: #fb923c; color-scheme: dark }

*, *::before, *::after { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font-body); margin: 0 }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }

.app { height: 100%; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; padding-inline: 16px }
header { display: flex; align-items: center; gap: 12px; padding-block: 14px 10px; border-bottom: 1px solid var(--line) }
.brand { font: 800 1.6rem/1 var(--font-display); letter-spacing: -0.02em; margin: 0 }
.brand span { background: linear-gradient(transparent 58%, var(--mark) 58% 90%, transparent 90%); padding-inline: 2px }
.status { font-size: .8rem; color: var(--muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .9rem; display: inline-flex; gap: 6px; align-items: center }
.icon-btn .count { background: var(--mark); color: var(--mark-ink); border-radius: 999px; padding: 0 7px; font-weight: 700; font-size: .78rem; font-variant-numeric: tabular-nums }

#log { flex: 1; overflow-y: auto; padding-block: 18px; display: flex; flex-direction: column; gap: 14px; min-height: 0 }
.turn { max-width: 88%; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.turn.tutor { align-self: flex-start }
.turn.me { align-self: flex-end; align-items: flex-end }
.bubble { padding: 10px 14px; border-radius: var(--radius); overflow-wrap: anywhere }
.tutor .bubble { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px }
.me .bubble { background: var(--me); color: var(--me-ink); border-bottom-right-radius: 4px }
.me .bubble.interim { opacity: .65; font-style: italic }
.me.failed .bubble { opacity: .55 }
.understood { font-size: .82rem; color: var(--muted); max-width: 100%; text-align: right }
.fix { font-size: .92rem; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface) }
.fix .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: block; margin-bottom: 2px }
.fix s { color: var(--muted) }
.fix mark { background: var(--mark); color: var(--mark-ink); padding: 0 3px; border-radius: 3px }
.fix .why { display: block; color: var(--muted); margin-top: 4px }
.replay { align-self: flex-start; border: 0; background: none; color: var(--muted); font-size: .8rem; padding: 0 2px; text-decoration: underline; text-underline-offset: 3px }
.example-tag { align-self: center; font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px }
.notice { align-self: stretch; font-size: .9rem; border-left: 3px solid var(--danger); background: var(--surface); padding: 8px 12px; border-radius: 6px }

.talkbar { border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px }
.talk-row { display: flex; align-items: center; justify-content: center; gap: 14px }
#mic { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; position: relative; transition: transform .15s }
#mic:disabled { opacity: .5; cursor: progress }
#mic svg { width: 32px; height: 32px }
#mic[data-state="listening"] { background: var(--listen) }
#mic[data-state="listening"]::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--listen); animation: pulse 1.4s ease-out infinite }
@keyframes pulse { from { transform: scale(.92); opacity: .9 } to { transform: scale(1.18); opacity: 0 } }
.side { width: 96px; font-size: .82rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center }
.switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer }
.hint { text-align: center; font-size: .85rem; color: var(--muted); min-height: 1.3em; margin: 0 }
form.typed { display: flex; gap: 8px }
form.typed input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px }
form.typed button { border: 0; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 9px 14px; font-weight: 700 }

.sheet { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 35%, transparent); display: flex; justify-content: flex-end; z-index: 10 }
.sheet > div { background: var(--paper); width: min(420px, 100%); height: 100%; overflow-y: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; border-left: 1px solid var(--line) }
.sheet h2 { font: 800 1.35rem/1.1 var(--font-display); margin: 0; flex: 1 }
.sheet-head { display: flex; align-items: center; gap: 10px }
.field { display: grid; gap: 4px }
.field label, .field .lab { font-weight: 700; font-size: .9rem }
.field small { color: var(--muted); font-size: .8rem }
.field select, .field input[type=text], .field input[type=password] { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; width: 100% }
.mode { font-size: .85rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px }
.mode b { color: var(--accent) }
.notes { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px }
.notes li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .92rem }
.notes s { color: var(--muted) }
.notes mark { background: var(--mark); color: var(--mark-ink); padding: 0 3px; border-radius: 3px }
.notes .why { color: var(--muted); display: block; margin-top: 3px }
.notes time { float: right; color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums }
.row { display: flex; gap: 8px; flex-wrap: wrap }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-size: .9rem }
.btn.danger { color: var(--danger) }
.empty { color: var(--muted); font-size: .92rem }
.big-state { display: none; text-align: center; font: 800 1.7rem/1.15 var(--font-display); margin: 0 }
.big-state[data-state="listening"] { color: var(--listen) }
.big-state[data-state="speaking"], .big-state[data-state="thinking"] { color: var(--accent) }
#mic[data-state="speaking"] { background: var(--accent) }
body.car .big-state { display: block }
body.car #mic { width: 128px; height: 128px }
body.car #mic svg { width: 52px; height: 52px }
body.car #log { font-size: 1.12rem }
body.car form.typed { display: none }
body.car .side { width: 110px; font-size: .95rem }
body.car .side .btn { padding: 12px 16px; font-size: 1rem }
@media (prefers-reduced-motion: reduce) { #mic[data-state="listening"]::after { animation: none; opacity: .6 } }
</style>

<div class="app">
  <header>
    <h1 class="brand"><span>Fluent</span></h1>
    <div class="status" id="status" aria-live="polite"></div>
    <button class="icon-btn" id="openNotes" type="button" data-i-aria="notesTitle"><span data-i="notesBtn">Carnet</span> <span class="count" id="noteCount">0</span></button>
    <button class="icon-btn" id="openSettings" type="button" data-i="settings">Réglages</button>
  </header>

  <main id="log" aria-live="polite"></main>

  <div class="talkbar">
    <p class="big-state" id="bigState" data-state="idle"></p>
    <p class="hint" id="hint"></p>
    <div class="talk-row">
      <div class="side"><label class="switch"><input type="checkbox" id="handsFree" checked> <span data-i="handsFree">Mains libres</span></label></div>
      <button id="mic" type="button" data-state="idle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
      </button>
      <div class="side"><button class="btn" id="stopAll" type="button" data-i="pause">Pause</button></div>
    </div>
    <form class="typed" id="typed" autocomplete="off">
      <input id="typedInput" type="text" data-i-aria="yourMessage">
      <button type="submit" data-i="send">Envoyer</button>
    </form>
  </div>
</div>

<div class="sheet" id="notesSheet" hidden>
  <div role="dialog" aria-modal="true" aria-labelledby="notesTitle">
    <div class="sheet-head"><h2 id="notesTitle" data-i="notesTitle">Carnet de corrections</h2><button class="btn" data-close type="button" data-i="close">Fermer</button></div>
    <ul class="notes" id="notes"></ul>
    <p class="empty" id="notesEmpty" data-i="notesEmpty"></p>
    <div class="row">
      <button class="btn" id="copyNotes" type="button" data-i="copyAll">Copier tout</button>
      <button class="btn danger" id="clearNotes" type="button" data-i="clearNotes">Vider le carnet</button>
    </div>
    <p class="empty" id="clearConfirm" hidden><span data-i="clearAsk">Vider le carnet ?</span> <button class="btn danger" id="clearYes" type="button" data-i="clearYes">Oui, vider</button> <button class="btn" id="clearNo" type="button" data-i="cancel">Annuler</button></p>
  </div>
</div>

<div class="sheet" id="settingsSheet" hidden>
  <div role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="sheet-head"><h2 id="settingsTitle" data-i="settings">Réglages</h2><button class="btn" data-close type="button" data-i="close">Fermer</button></div>
    <div class="field">
      <label for="ui" data-i="uiLang">Langue de l'interface</label>
      <select id="ui"><option value="fr">Français</option><option value="en">English</option></select>
    </div>
    <div class="mode" id="modeBox"></div>
    <div class="field" id="keyField">
      <label for="apiKey" data-i="apiKey">Clé API Anthropic</label>
      <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off">
      <small data-i="apiKeyHelp"></small>
    </div>
    <div class="field" id="modelField">
      <label for="model" data-i="model">Modèle</label>
      <select id="model">
        <option value="claude-opus-5-5" data-i="modelOpus">Claude Opus 5.5</option>
        <option value="claude-sonnet-5-5" data-i="modelSonnet">Claude Sonnet 5.5</option>
        <option value="claude-haiku-5-5" data-i="modelHaiku">Claude Haiku 5.5</option>
      </select>
    </div>
    <div class="field">
      <label for="lang" data-i="lang">Langue pratiquée</label>
      <select id="lang"></select>
    </div>
    <div class="field">
      <label for="native" data-i="nativeLang">Votre langue maternelle</label>
      <select id="native"></select>
      <small data-i="nativeHelp"></small>
    </div>
    <div class="field">
      <label for="level" data-i="level">Votre niveau</label>
      <select id="level">
        <option value="A2" data-i="A2">A2</option>
        <option value="B1" data-i="B1">B1</option>
        <option value="B2" data-i="B2">B2</option>
        <option value="C1" data-i="C1">C1</option>
      </select>
    </div>
    <div class="field">
      <label for="topic" data-i="topic">Sujet de conversation</label>
      <input id="topic" type="text" data-i-ph="topicPh">
    </div>
    <div class="field">
      <label for="voice" data-i="voice">Voix</label>
      <select id="voice"></select>
    </div>
    <div class="field">
      <label for="rate"><span data-i="rate">Vitesse de la voix :</span> <span id="rateVal">0.95</span></label>
      <input id="rate" type="range" min="0.6" max="1.3" step="0.05" value="0.95">
    </div>
    <div class="field">
      <label for="endWord" data-i="endWord">Mot de fin</label>
      <input id="endWord" type="text">
      <small data-i="endWordHelp"></small>
    </div>
    <div class="field" id="patienceField">
      <label for="patience"><span data-i="patience">Silence avant envoi :</span> <span id="patienceVal">1.8</span> s</label>
      <input id="patience" type="range" min="1" max="4" step="0.2" value="1.8">
      <small data-i="patienceHelp"></small>
    </div>
    <div class="field">
      <span class="lab" data-i="carMode">Mode voiture</span>
      <label class="switch"><input type="checkbox" id="carMode"> <span data-i="carModeLabel"></span></label>
      <small data-i="carModeHelp"></small>
    </div>
    <div class="field">
      <span class="lab" data-i="corrections">Corrections</span>
      <label class="switch"><input type="checkbox" id="nativeExplain" checked> <span data-i="nativeExplain"></span></label>
      <label class="switch"><input type="checkbox" id="speakFix" checked> <span data-i="speakFix"></span></label>
    </div>
    <div class="row"><button class="btn" id="newChat" type="button" data-i="newChat">Nouvelle conversation</button></div>
  </div>
</div>

  get(k, d) { try { const v = localStorage.getItem("fluent:" + k); return v === null ? d : JSON.parse(v) } catch { return d } },
  set(k, v) { try { localStorage.setItem("fluent:" + k, JSON.stringify(v)) } catch {} },
};

  };
  try { r.start() }
  catch { s.cancelled = true; micBlocked = true; micFallback() }
}

function commitRun(s) {
  const c = s.current;
  if (!c) return;
  s.done.push(...c.segs); s.alts.push(...c.segAlts);
  if (c.interim) { s.done.push(c.interim); s.alts.push([]) }
  s.current = null;
}
function sessionText(s) {
  const c = s.current || { segs: [], interim: "" };
  return [...s.done, ...c.segs, c.interim].filter(Boolean).join(" ");
}

// Ends the session and sends what was said (end word, silence, or a tap on the mic).
function finish(s) {
  if (s.finishing || s.cancelled) return;
  s.finishing = true;
  clearTimeout(silenceTimer);
  if (rec) rec.stop(); else complete(s);
}
function complete(s) {
  if (session !== s) return;
  session = null;
  clearInterim();
  let text = s.done.join(" ").trim();
  const alts = s.alts.filter((a) => a.length);
  if (settings.endWord) {
    if (endsWithEndWord(text)) text = dropLastWords(text, words(settings.endWord).length);
    else if (s.alts.at(-1)?.some(endsWithEndWord)) text = dropLastWords(text, 1);
  }
  if (text) send(text, alts);
  else setState("idle", t("heardNothing"));
}
function stopListening(discard) {
  const s = session;
  if (!s) return;
  if (discard) { s.cancelled = true; session = null; clearTimeout(silenceTimer); rec?.abort(); clearInterim() }
  else finish(s);
}

function micFallback() {
  session = null; clearInterim();
  setState("idle", "");
  const msg = !SR
    ? t("noSRNotice")
    : t("micBlockedNotice");
  if (!document.querySelector(".notice")) addNotice(msg);
  $("typedInput").focus();
}

// ---------- transcript UI ----------
let started = false;
function ensureStarted() {
  if (started) return;
  started = true;
  $("log").innerHTML = "";
}
function scrollDown() { const l = $("log"); l.scrollTop = l.scrollHeight }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }

let interimEl = null;
function showInterim(text) {
  ensureStarted();
  if (!interimEl) { interimEl = el("div", "turn me"); interimEl.append(el("div", "bubble interim")); $("log").append(interimEl) }
  interimEl.firstChild.textContent = text || "…";
  scrollDown();
}
function clearInterim() { interimEl?.remove(); interimEl = null }

function addMe(text) { const turn = el("div", "turn me"); turn.append(el("div", "bubble", text)); $("log").append(turn); scrollDown(); return turn }
function addUnderstood(meEl, understood, said) {
  if (!meEl || !understood || norm(understood) === norm(said)) return;
  meEl.append(el("div", "understood", t("understood") + understood));
}
function addTutor(data) {
  const turn = el("div", "turn tutor");
  if (data.has_mistake && data.corrected) turn.append(fixEl(data, "div", "fix"));
  turn.append(el("div", "bubble", data.reply));
  const again = el("button", "replay", t("replay")); again.type = "button";
  again.onclick = () => speak(data.reply);
  turn.append(again);
  $("log").append(turn); scrollDown();
}
function fixEl(d, tag, cls) {
  const f = el(tag, cls);
  if (cls === "fix") f.append(el("span", "label", t("correction")));
  if (d.original) { f.append(el("s", null, d.original), " → ") }
  f.append(el("mark", null, d.corrected));
  if (d.explanation) f.append(el("span", "why", d.explanation));
  return f;
}
function addNotice(text) { ensureStarted(); $("log").append(el("div", "notice", text)); scrollDown() }

// ---------- conversation loop ----------
// What Claude receives for a spoken turn: the transcript plus the recognizer's other hypotheses.
function packTurn(text, alts) {
  if (!alts?.length) return text;
  const lines = alts.map((a, i) => `${i + 1}. ${a.slice(0, 3).join(" | ")}`).join("\n");
  return `${text}\n\n[Other speech-recognition hypotheses, per segment:\n${lines}]`;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const retryable = (e) => !e?.userMessage && (e?.status === undefined || e.status >= 500 || e.status === 429 || e?.code === "upstream_error") && !["not_granted", "sampling_disabled", "session_expired", "refused", "invalid_json", "rate_limited"].includes(e?.code);
let lastReply = "";

async function send(text, alts) {
  ensureStarted();
  setActive(true);
  const opening = text === OPENING;
  const meEl = opening ? null : addMe(text);
  turns.push({ role: "user", content: opening ? OPENING : packTurn(text, alts) });
  setState("thinking", "");
  let data;
  for (let attempt = 0; ; attempt++) {
    try {
      data = await askTutor();
      if (!data || typeof data.reply !== "string") throw { userMessage: t("errUnreadable") };
      break;
    } catch (e) {
      if (attempt < 3 && retryable(e)) {
        if (attempt === 0) { $("hint").textContent = t("connHint"); say("sayRetry") }
        await sleep(2000 * 2 ** attempt);
        continue;
      }
      turns.pop();
      meEl?.classList.add("failed");
      addNotice(errorText(e));
      if (opening) { turns = []; setActive(false); setState("idle", t("retryHint")); return }
      await say("sayFail");
      if (settings.handsFree && !micBlocked) listen(); else setState("idle", t("retryHint"));
      return;
    }
  }
  const action = ACTIONS.includes(data.action) ? data.action : "none";
  if (action === "repeat") {
    turns.pop();  // the command itself is not part of the conversation
    meEl?.remove();
    setState("speaking", t("interruptHint"));
    await speak(lastReply);
    return afterSpeaking();
  }
  if (action === "slower" || action === "faster") {
    settings.rate = Math.min(1.3, Math.max(0.6, Math.round((settings.rate + (action === "slower" ? -0.1 : 0.1)) * 100) / 100));
    $("rate").value = settings.rate; $("rateVal").textContent = settings.rate; saveSettings();
  }
  turns.push({ role: "assistant", content: data.reply || "OK." });
  if (action === "none") addUnderstood(meEl, data.understood, text);
  if (data.reply) { addTutor(data); lastReply = data.reply }
  if (action === "none" && data.has_mistake && data.corrected) saveNote(data);
  setState("speaking", t("interruptHint"));
  if (action === "none" && settings.speakFix && data.has_mistake && data.corrected) await speak(`${L().tip}: ${data.corrected}.`);
  if (state !== "speaking") return;
  await speak(data.reply);
  if (action === "pause") { setActive(false); setState("idle", t("pausedHint")); return }
  afterSpeaking();
}

function afterSpeaking() {
  if (state !== "speaking") return;
  if (settings.handsFree && !micBlocked) listen();
  else setState("idle", micBlocked ? t("answerBelow") : t("yourTurn"));
}

function start() {
  ensureStarted();
  // A first speak() inside the tap unlocks audio on iOS.
  if (synth) { const u = new SpeechSynthesisUtterance(""); synth.speak(u) }
  send(OPENING);
}

$("mic").addEventListener("click", () => {
  if (state === "thinking") return;
  if (!started || turns.length === 0) return start();
  if (state === "listening") return stopListening(false);
  if (state === "listening" || session) return;
  if (state === "speaking") { synth?.cancel(); setState("idle") }
  listen();
});
$("stopAll").addEventListener("click", () => {
  synth?.cancel(); stopListening(true); setActive(false);
  if (state !== "thinking") setState("idle", t("pausedHint"));
});
// Keyboard dictation (e.g. Gboard's mic): saying the end word sends the message.
$("typedInput").addEventListener("input", () => {
  const v = $("typedInput").value;
  if (settings.endWord && endsWithEndWord(v) && state !== "thinking") {
    $("typedInput").value = dropLastWords(v, words(settings.endWord).length);
    $("typed").requestSubmit();
  }
});
$("typed").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("typedInput").value.trim();
  if (!v || state === "thinking") return;
  $("typedInput").value = "";
  synth?.cancel(); stopListening(true);
  send(v);
});
$("newChat").addEventListener("click", () => {
  synth?.cancel(); stopListening(true); setActive(false); turns = []; lastReply = "";
  $("log").innerHTML = ""; started = true; closeSheets();
  setState("idle", t("newChatHint"));
});

// ---------- notebook ----------
let notes = store.get("notes", []);
function saveNote(d) {
  notes.unshift({ original: d.original, corrected: d.corrected, explanation: d.explanation, at: Date.now() });
  notes = notes.slice(0, 300); store.set("notes", notes); renderNotes();
}
function renderNotes() {
  $("noteCount").textContent = notes.length;
  const ul = $("notes"); ul.innerHTML = "";
  for (const n of notes) {
    const li = fixEl(n, "li", "");
    li.prepend(el("time", null, new Date(n.at).toLocaleDateString(settings.ui === "fr" ? "fr-FR" : "en-GB", { day: "numeric", month: "short" })));
    ul.append(li);
  }
  $("notesEmpty").hidden = notes.length > 0;
}
renderNotes();
$("copyNotes").addEventListener("click", async () => {
  const txt = notes.map((n) => `${n.original ? n.original + " → " : ""}${n.corrected}${n.explanation ? " (" + n.explanation + ")" : ""}`).join("\n");
  try { await navigator.clipboard.writeText(txt); $("copyNotes").textContent = t("copied") }
  catch { $("copyNotes").textContent = t("copyFailed") }
  setTimeout(() => $("copyNotes").textContent = t("copyAll"), 1600);
});
$("clearNotes").addEventListener("click", () => $("clearConfirm").hidden = false);
$("clearNo").addEventListener("click", () => $("clearConfirm").hidden = true);
$("clearYes").addEventListener("click", () => { notes = []; store.set("notes", notes); renderNotes(); $("clearConfirm").hidden = true });

// ---------- sheets ----------
function openSheet(id) { $(id).hidden = false; $(id).querySelector("[data-close]").focus() }
function closeSheets() { document.querySelectorAll(".sheet").forEach((s) => s.hidden = true) }
$("openNotes").addEventListener("click", () => openSheet("notesSheet"));
$("openSettings").addEventListener("click", () => openSheet("settingsSheet"));
document.querySelectorAll(".sheet").forEach((s) => {
  s.addEventListener("click", (e) => { if (e.target === s || e.target.matches("[data-close]")) closeSheets() });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheets() });

function renderExample() {
  const [q, said, orig, corr, whyByLang, reply] = L().example;
  const why = settings.nativeExplain ? whyByLang[settings.native] : "";
  const log = $("log");
  log.innerHTML = "";
  log.append(el("span", "example-tag", t("example")));
  const t1 = el("div", "turn tutor"); t1.append(el("div", "bubble", q));
  const t2 = el("div", "turn me"); t2.append(el("div", "bubble", said));
  const t3 = el("div", "turn tutor"); t3.append(fixEl({ original: orig, corrected: corr, explanation: why }, "div", "fix"), el("div", "bubble", reply));
  log.append(t1, t2, t3);
}
function renderCar() { document.body.classList.toggle("car", !!settings.carMode) }
// Puts every on-screen text in the interface language.
function applyI18n() {
  document.documentElement.lang = settings.ui;
  document.querySelectorAll("[data-i]").forEach((e) => { e.textContent = t(e.dataset.i) });
  document.querySelectorAll("[data-i-ph]").forEach((e) => { e.placeholder = t(e.dataset.iPh) });
  document.querySelectorAll("[data-i-aria]").forEach((e) => { e.setAttribute("aria-label", t(e.dataset.iAria)) });
  fillLanguageLists();
  renderMode();
  renderEndWord();
  renderNotes();
  if (!turns.length) renderExample();
  setState(state);
}
renderCar();
applyI18n();
$("hint").textContent = SR ? t("startHint") : t("noSRHint");
</script>
</body>
</html>
